schema_version: 1

context:
  name: minilog
  version: "2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/minilog-${{ version }}.tar.gz
  sha256: c2e8508f90a47757fff7e60a0ebfcb3e92bfbac9298f2a2fd890a75b3b502d3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - log
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Minimalistic wrapper for Python logging.
  license: MIT
  license_file: LICENSE.md
  homepage: https://pypi.org/project/minilog

extra:
  recipe-maintainers:
    - jacebrowning
    - diegoferigo
